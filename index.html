<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Unsung</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*{touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:#070913;color:#efe6d2;font-family:"Cormorant Garamond",Georgia,serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#bars{position:absolute;left:16px;top:14px;width:min(44vw,260px)}
.bar{height:8px;background:rgba(8,8,14,.6);border:1px solid rgba(239,230,210,.5);margin-bottom:5px;position:relative;border-radius:1px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;transition:transform .12s linear}
.bar.hp i{background:#c8322f}
#obj{position:absolute;left:16px;top:50px;max-width:min(92vw,520px);white-space:nowrap;font-size:16px;letter-spacing:.04em;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .4s}
#obj::before{content:"";display:inline-block;width:7px;height:7px;background:#d9b24a;transform:rotate(45deg);margin:0 9px 2px 2px}
#hold{position:absolute;left:16px;top:80px;width:min(44vw,220px);display:none}
#hold .bar{height:5px}#hold .bar i{background:#8fd0c0}
#tgt{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:min(52vw,340px);text-align:center;opacity:0;transition:opacity .2s}
#tgt span{font-size:13px;letter-spacing:.24em;text-shadow:0 1px 3px #000}
#tgt .bar{margin-top:4px;height:6px}#tgt .bar i{background:#e8dcc0}
#tgt.boss{top:auto;bottom:74px;width:min(80vw,560px)}#tgt.boss .bar{height:8px}#tgt.boss .bar i{background:#a66cf0}#tgt.boss span{font-size:16px}
#lk{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:min(52vw,340px);text-align:center;opacity:0;transition:opacity .2s} /* the foe he is locked on to, while a boss has the main bar */
#lk span{font-size:13px;letter-spacing:.24em;text-shadow:0 1px 3px #000}#lk .bar{margin-top:4px;height:6px}#lk .bar i{background:#e8dcc0}
/* Nameplates over the soldiers on his side (hud.js, plates): a name, and for those who can be hurt a thin bar under it. */
#plates{position:absolute;inset:0;overflow:hidden}
.plate{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;will-change:transform}
.plate span{font-size:12px;font-weight:700;letter-spacing:.2em;text-indent:.2em;color:#dfe8f4;text-shadow:0 0 2px #000,0 1px 3px #000,0 0 8px rgba(0,0,0,.7)}
.plate .bar{width:46px;height:4px;margin:2px auto 0;border-color:rgba(223,232,244,.55)}.plate .bar i{background:#8fb4e0}.plate.low .bar i{background:#d8743c}
/* The waypoint pointer (hud.js, wayPoint): over the place when it is in view, at the edge of the play area pointing to it when it is not, with the distance. */
#way{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s;will-change:transform;text-align:center;width:60px;margin:-30px 0 0 -30px;height:60px}
#way svg{position:absolute;left:17px;top:17px;width:26px;height:26px;overflow:visible;fill:none;stroke:#f0c860;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 5px rgba(0,0,0,.8)) drop-shadow(0 0 7px rgba(233,193,90,.55))}
#way span{position:absolute;left:-20px;right:-20px;top:40px;font-size:14px;font-weight:700;letter-spacing:.08em;color:#ffe7a0;text-shadow:0 0 2px #000,0 1px 3px #000,0 0 8px rgba(0,0,0,.8)}
/* Stamina and guard, beside him (hud.js, ring): the ring empties as stamina is spent and goes when it is full again; the shield in it lights while his guard is up. */
#ring{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;opacity:0;transition:opacity .45s;will-change:transform}
#ring svg{display:block;width:100%;height:100%;overflow:visible}
#ring .bg{fill:rgba(8,8,14,.38);stroke:rgba(8,8,14,.7);stroke-width:5.5}
#ring .fg{fill:none;stroke:#e2b84c;stroke-width:3.4;stroke-linecap:butt;stroke-dasharray:100;transform:rotate(-90deg);transform-origin:20px 20px;transition:stroke .2s}
#ring.low .fg{stroke:#e0622e}
#ring .sh{fill:rgba(239,230,210,0);stroke:rgba(239,230,210,0);stroke-width:1.4;stroke-linejoin:round;transform-origin:20px 20px;transition:fill .12s,stroke .12s}
#ring.guard{opacity:1}#ring.guard .sh{fill:rgba(233,193,90,.92);stroke:#fff3cf}#ring.guard .bg{fill:rgba(8,8,14,.6)}
#ring.guard svg{filter:drop-shadow(0 0 6px rgba(233,193,90,.75))}
#ring.hit .sh{animation:shhit .32s ease-out}#ring.parry .sh{animation:shparry .5s ease-out}#ring.broke .sh{animation:shbroke .7s ease-out}#ring.tired .fg{animation:rtired .5s}
@keyframes shhit{0%{transform:scale(1.55);fill:#fff}}
@keyframes shparry{0%{transform:scale(2.3);fill:#fff;stroke:#fff}60%{fill:#ffe7a0}}
@keyframes shbroke{0%,70%{fill:#ff5040;stroke:#ff5040}0%{transform:scale(1.7)}}
@keyframes rtired{0%,60%{stroke:#ff5040}}
/* Something thrown at him (hud.js, threats): a red mark on a circle round him, on the side it is coming from; pulsing while the thrower winds up, steady and bright while it flies. */
.threat{position:absolute;left:0;top:0;width:60px;height:26px;margin:-13px 0 0 -30px;will-change:transform;display:none}
.threat svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 7px rgba(255,50,30,.9))}
.threat path{stroke:#ff3a26;fill:none;stroke-width:5;stroke-linecap:round}.threat path+path{fill:#ff3a26;stroke:none}
.threat.wind svg{animation:thr .34s ease-in-out infinite alternate}.threat.fly path{stroke:#ff5a34}.threat.fly path+path{fill:#fff}
@keyframes thr{from{opacity:.45;transform:scale(.9)}to{opacity:1;transform:scale(1.08)}}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:clamp(24px,6vw,46px);font-weight:700;letter-spacing:.28em;text-indent:.28em;opacity:0;transition:opacity .6s;text-shadow:0 2px 8px #000}
#banner.long{font-size:clamp(17px,4vw,26px);font-weight:500;font-style:italic;letter-spacing:.08em;text-indent:0;top:30%}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;max-width:min(92vw,620px);text-align:center;font-size:16px;line-height:1.35;
  padding:7px 16px;background:rgba(8,8,14,.55);border-radius:2px;opacity:0;transition:opacity .3s}
#hint b{color:#e9c15a;font-weight:700}
/* A tip the fight is slowed for (ui.tip): mid-screen and larger, between two gold rules; the rest of the HUD stands back. */
#hint.tip{bottom:auto;top:17%;font-size:21px;line-height:1.4;width:max-content;max-width:min(86vw,560px);padding:16px 26px;background:none;border-radius:0;text-shadow:0 1px 3px #000,0 0 14px #000;
  border-top:1px solid rgba(233,193,90,.75);border-bottom:1px solid rgba(233,193,90,.75);background:linear-gradient(90deg,rgba(8,8,14,0),rgba(8,8,14,.6) 18%,rgba(8,8,14,.6) 82%,rgba(8,8,14,0));animation:none}
#hud>*{transition:filter .3s}#hud.focus>*:not(#hint):not(#tgt){filter:opacity(.3)}
#obj{transform-origin:left center}
#obj.new{animation:objin 2.2s ease-out}#obj.new::before{animation:objmark 2.2s ease-out}
@keyframes objin{0%{transform:translateX(-12px) scale(1.16);color:#ffe7a0;text-shadow:0 0 16px #e9c15a,0 1px 3px #000}12%,55%{transform:scale(1.16);color:#ffe7a0;text-shadow:0 0 16px #e9c15a,0 1px 3px #000}}
@keyframes objmark{0%,55%{box-shadow:0 0 10px 3px #e9c15a;background:#ffe7a0}}
#hint.new{animation:hintin 2.4s ease-out}
@keyframes hintin{0%{transform:translateX(-50%) translateY(12px) scale(1.18);background:rgba(8,8,14,.9);box-shadow:0 0 0 1px #e9c15a,0 0 26px rgba(233,193,90,.85)}14%,55%{transform:translateX(-50%) scale(1.18);background:rgba(8,8,14,.9);box-shadow:0 0 0 1px #e9c15a,0 0 26px rgba(233,193,90,.85)}100%{box-shadow:0 0 0 1px rgba(233,193,90,0),0 0 26px rgba(233,193,90,0)}}
/* What he thinks: one line of soft italic text above the hint line, no box, no cloud. Shadowed for legibility on any ground;
   it comes in quickly, drifts up a touch and goes by itself (timed in ui.thought), and nothing can be clicked through it. */
#thought{position:absolute;left:50%;transform:translate(-50%,6px);bottom:64px;width:max-content;max-width:min(88vw,560px);text-align:center;
  font-size:17px;font-style:italic;line-height:1.35;letter-spacing:.02em;color:rgba(232,226,244,.92);pointer-events:none;
  text-shadow:0 0 2px #000,0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.7),0 0 22px rgba(0,0,0,.5);opacity:0;transition:opacity .9s ease-in,transform .9s ease-in}
#tgt.boss~#thought{bottom:128px} /* a boss's bar sits low in the middle on a desktop: the thought goes above it */
#thought.on{opacity:1;transform:translate(-50%,0);transition:opacity .35s ease-out,transform .6s ease-out}
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;width:min(94vw,640px);padding:14px 20px 18px;background:rgba(8,8,14,.82);
  border-top:1px solid rgba(217,178,74,.7);display:none}
#dlg .who{font-size:13px;letter-spacing:.26em;color:#e9c15a;margin-bottom:5px;text-transform:uppercase}
#dlg .who:empty{display:none}
#dlg .txt{font-size:20px;line-height:1.3;min-height:2.6em}
#dlg .more{position:absolute;right:12px;bottom:7px;font-size:13px;letter-spacing:.14em;color:#e9c15a;padding:3px 9px;border:1px solid rgba(233,193,90,.75);border-radius:3px;background:rgba(233,193,90,.12);animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px);opacity:.7}}
#dlg{cursor:pointer;pointer-events:auto}
/* A line that waits for a tap: framed in gold, with the prompt. A passing line (ui.say): lighter, no prompt, a bar running down, and taps go through it to the game. */
#dlg.wait{border:1px solid rgba(217,178,74,.7);box-shadow:0 0 18px rgba(0,0,0,.6)}
#dlg.wait .txt{padding-bottom:10px}
#dlg.say{background:rgba(8,8,14,.5);border-top-color:transparent;pointer-events:none;cursor:default}
#dlg.say .txt{font-size:18px;min-height:0}
#dlg .time{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(233,193,90,.7);transform-origin:left;display:none}
#dlg.say .time{display:block}
#fade{position:fixed;inset:0;background:#05060c;opacity:1;pointer-events:none;transition:opacity 1s}
#chron{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;background:#05060c;cursor:pointer}
#chron .page{width:min(100%,560px);transition:opacity 1s}
#chron.out .page{opacity:0}
#chron h2{font-size:13px;letter-spacing:.3em;font-weight:500;color:#e9c15a;padding-bottom:12px;margin-bottom:22px;text-transform:uppercase;border-bottom:1px solid rgba(217,178,74,.35);opacity:0;transition:opacity 1.1s}
#chron.on h2{opacity:1}
#chron p{font-size:clamp(17px,4.4vw,22px);line-height:1.45;margin-bottom:16px;opacity:0;transition:opacity 1.1s}
#chron p.on{opacity:1}
#chron p em{display:block;text-align:center;margin-bottom:6px}
#chron .tap{margin-top:10px;font-size:12px;letter-spacing:.3em;opacity:0;text-align:center}
#chron .tap.on{opacity:.55;animation:tapin 1s ease-out .9s both,pulse 1.6s ease-in-out 1.9s infinite}@keyframes tapin{from{opacity:0}}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch button{position:absolute;pointer-events:auto;border-radius:50%;border:1.5px solid rgba(239,230,210,.65);background:rgba(8,8,14,.4);
  color:#efe6d2;font:700 12px "Cormorant Garamond",Georgia,serif;letter-spacing:.1em;touch-action:none}
#touch button.on{background:rgba(217,178,74,.55)}
#bL{right:18px;bottom:64px;width:82px;height:82px;font-size:14px}
#bH{right:112px;bottom:30px;width:62px;height:62px}
#bD{right:116px;bottom:106px;width:62px;height:62px}
#bB{right:42px;bottom:160px;width:66px;height:66px}
#bK{right:18px;bottom:242px;width:50px;height:50px;font-size:10px}
#stick,#knob{position:absolute;border-radius:50%;display:none;pointer-events:none}
#stick{width:110px;height:110px;margin:-55px 0 0 -55px;border:1.5px solid rgba(239,230,210,.45);background:rgba(8,8,14,.25)}
#knob{width:46px;height:46px;margin:-23px 0 0 -23px;background:rgba(239,230,210,.55)}
#title,#pause{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at center,rgba(7,9,19,.55),rgba(7,9,19,.95))}
#title{overflow-y:auto;justify-content:safe center}
/* Until the game has loaded and drawn its first frame (main.js takes .loading off) the title shows its name and a quiet LOADING, no buttons. */
#title.loading .tpanel{opacity:0;pointer-events:none;transition:none}
#tload{display:none;margin-top:34px;font-size:13px;letter-spacing:.4em;text-indent:.4em;opacity:.6;animation:pulse 1.6s ease-in-out infinite}
#title.loading #tload{display:block;position:absolute;top:calc(50% + 30px);left:0;right:0}
#pause{display:none;background:rgba(5,6,12,.94);overflow-y:auto;justify-content:flex-start}
#pause h2{font-size:15px;letter-spacing:.4em;text-indent:.4em;font-weight:500;color:#e9c15a;margin:auto 0 22px}#pause>:last-child{margin-bottom:auto}
.btn{font:700 17px "Cormorant Garamond",Georgia,serif;letter-spacing:.3em;text-indent:.3em;color:#efe6d2;background:rgba(8,8,14,.5);border:1.5px solid rgba(217,178,74,.75);
  padding:12px 0;width:min(70vw,240px);margin:6px 0;cursor:pointer;border-radius:2px}
.btn:hover,.btn:focus-visible{background:rgba(217,178,74,.25);outline:none}
.btn.main{font-size:22px;padding:14px 0;margin-top:30px}
.btn.small{font-size:13px;padding:9px 0}
/* The pause menu's groups (.grp: the pause menu, and the title's MORE panel while it borrows them). */
.grp label{display:block;margin:8px 0 6px;font-size:14px;letter-spacing:.14em}
.grp details{width:min(70vw,240px);border-top:1px solid rgba(217,178,74,.3);flex-shrink:0}.grp details:first-of-type{margin-top:22px}.grp details:last-of-type{border-bottom:1px solid rgba(217,178,74,.3)}
.grp summary{cursor:pointer;list-style:none;padding:11px 0;font-size:13px;font-weight:700;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#e9c15a;opacity:.85}.grp summary::-webkit-details-marker{display:none}
.grp summary:hover,.grp summary:focus-visible{opacity:1;background:rgba(217,178,74,.12);outline:none}.grp summary::after{content:'+';margin-left:.5em;opacity:.7}.grp details[open] summary::after{content:'\2212'}
.grp details>:last-child{margin-bottom:14px}.grp details .note{font-size:13px;font-style:italic;opacity:.7;margin:2px 0 8px;line-height:1.3}
.grp input[type=range]{width:min(70vw,240px);accent-color:#d9b24a}
.grp dl{margin-top:4px;display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:14px;text-align:left}
.grp dt{color:#e9c15a;text-align:right}
#bP{top:12px;right:12px;width:40px;height:40px;font-size:15px;letter-spacing:0}
#title h1{font-size:clamp(38px,11vw,84px);letter-spacing:.2em;text-indent:.2em;font-weight:700}
/* The title's panels (main.js, panel): one at a time under the name, each at least as tall as the tallest closed one so the name stays put as they change. */
#title .tpanel{display:flex;flex-direction:column;align-items:center;margin-top:30px;min-height:250px;flex-shrink:0;transition:opacity .7s;animation:tin .35s ease-out}
#title .tpanel[hidden]{display:none}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
#title .tpanel>.btn{margin:7px 0}
#tconf .tq{font-size:13px;font-weight:500;letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;color:#e9c15a}
#tconf .tname{font-size:30px;font-weight:600;letter-spacing:.06em;margin:12px 0 4px}
#tconf .tact{font-size:14px;font-style:italic;letter-spacing:.12em;opacity:.7;margin-bottom:22px}
#tmorep details:first-of-type{margin-top:4px}#title #tmorep>.btn{margin-top:22px}
.chaps{display:flex;flex-direction:column;align-items:stretch;width:min(70vw,240px);margin:2px auto 0;text-align:left}
.chaps .act{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.55;margin:12px 0 3px;padding-bottom:4px;border-bottom:1px solid rgba(217,178,74,.25)}.chaps .act:first-child{margin-top:6px}
.chap{font:600 17px "Cormorant Garamond",Georgia,serif;letter-spacing:.05em;color:#efe6d2;background:none;border:0;padding:6px 4px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer}
.chap i{font-style:normal;font-size:12px;letter-spacing:.08em;color:#e9c15a;opacity:.8;width:2.4em;text-align:right;flex-shrink:0}
.chap:hover,.chap:focus-visible{background:rgba(217,178,74,.16);outline:none}.chap.now{color:#e9c15a}.chap.now::after{content:'\25C2';margin-left:auto;font-size:11px}
.chap:disabled{opacity:.3;cursor:default;background:none}
@media (pointer:coarse){.chap{padding:10px 4px}}

/* When the graphics are lost or refused (renderer.js, notice): over everything, in place of a white canvas or a title stuck on LOADING. */
#gpu{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 24px;background:#05060c}
#gpu h2{font-size:15px;letter-spacing:.4em;text-indent:.4em;font-weight:500;color:#e9c15a;margin-bottom:18px}
#gpu p{max-width:min(100%,460px);font-size:18px;line-height:1.45;margin-bottom:22px}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){#dlg .more,#dlg .time,#chron .tap,#obj.new,#hint.new{animation:none}}
@media (max-width:600px){#ring{width:40px;height:40px;margin:-20px 0 0 -20px}#bars{width:40vw}#tgt,#lk{left:auto;right:62px;transform:none;width:36vw}#tgt.boss{left:50%;right:auto;transform:translateX(-50%);bottom:auto;top:132px;width:80vw}
  #tgt:not(.boss) span,#lk span{white-space:nowrap;font-size:12px;letter-spacing:.08em}} /* a long name stays on one line: wrapped, it pushed the bar down onto the objective */
#tgt.boss~#dlg.say{bottom:104px} /* a passing line sits above a boss's bar, not on it */
/* (Owner, Nov 2026, from an iPhone: a thought floating mid-screen read oddly, over the fight.) On a touch screen the thought
   hangs under the objective, aligned with its text and smaller: what he thinks reads as the reason for what he is doing, and
   it stays off the play. The hint moves down a little so a two-line thought clears it. */
@media (pointer:coarse){#hint{bottom:auto;top:122px}#hint.tip{top:176px;font-size:18px;padding:13px 16px}#tgt.boss~#hint{top:176px}#dlg{bottom:auto;top:96px}#tgt.boss~#dlg.say{bottom:auto;top:176px}
  @keyframes objin{0%{transform:translateX(-12px) scale(1.05);color:#ffe7a0;text-shadow:0 0 16px #e9c15a,0 1px 3px #000}12%,55%{transform:scale(1.05);color:#ffe7a0;text-shadow:0 0 16px #e9c15a,0 1px 3px #000}} /* long objectives ran off a phone's edge at 1.16 */
  #thought,#tgt.boss~#thought{left:34px;right:16px;bottom:auto;top:75px;width:auto;max-width:520px;text-align:left;font-size:14px;line-height:1.3;transform:translateY(-5px)}
  #thought.on,#tgt.boss~#thought.on{transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="visibility:hidden">
  <div id="plates"></div>
  <div id="bars"><div class="bar hp"><i id="hp"></i></div></div>
  <div id="obj"></div>
  <div id="hold"><div class="bar"><i id="holdp"></i></div></div>
  <div id="tgt"><span id="tname"></span><div class="bar"><i id="thp"></i></div></div>
  <div id="lk"><span id="lname"></span><div class="bar"><i id="lhp"></i></div></div>
  <div id="way"><svg viewBox="0 0 24 24"><path d="M4.5 12.5L12 5l7.5 7.5"/><path d="M4.5 20.5L12 13l7.5 7.5" style="opacity:.5"/></svg><span></span></div>
  <div id="threats"></div>
  <div id="ring"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" id="ringf" cx="20" cy="20" r="16" pathLength="100"/><path class="sh" d="M20 11.5l6.2 2.2v5.4c0 4.4-3 7.2-6.2 8.6-3.2-1.4-6.2-4.2-6.2-8.6v-5.4z"/></svg></div>
  <div id="banner"></div>
  <div id="hint"></div>
  <div id="thought"></div>
  <div id="dlg"><div class="who" id="dwho"></div><div class="txt" id="dtxt"></div><div class="more" id="dmore"></div><div class="time" id="dtime"></div></div>
</div>
<div id="touch">
  <div id="stick"></div><div id="knob"></div>
  <button id="bL" data-a="l">STRIKE</button>
  <button id="bH" data-a="h">HEAVY</button>
  <button id="bD" data-a="d">DODGE</button>
  <button id="bB" data-a="b">GUARD</button>
  <button id="bK" data-a="k">LOCK</button>
  <button id="bP" data-a="p" aria-label="Pause">II</button>
</div>
<div id="fade"></div>
<div id="chron"><div class="page"><h2 id="chead"></h2><div id="clines"></div><div class="tap" id="ctap"></div></div></div>
<div id="title" class="loading">
  <h1>THE UNSUNG</h1>
  <p id="tload">LOADING</p>
  <div class="tpanel" id="tmenu">
    <button class="btn main" id="tcont" style="display:none">CONTINUE</button>
    <button class="btn main" id="tplay">PLAY</button>
    <button class="btn" id="tmore">MORE</button>
  </div>
  <div class="tpanel" id="tconf" hidden>
    <p class="tq">Continue from</p>
    <p class="tname" id="tcname"></p>
    <p class="tact" id="tcact"></p>
    <button class="btn main" id="tgo">CONTINUE</button>
    <button class="btn small" id="tback">BACK</button>
  </div>
  <!-- MORE: the pause menu's groups are moved in here while it is open (main.js, panel) -->
  <div class="tpanel grp" id="tmorep" hidden>
    <button class="btn small" id="tmback">BACK</button>
  </div>
</div>
<div id="pause" class="grp">
  <h2>PAUSED</h2>
  <button class="btn" id="presume">RESUME</button>
  <button class="btn small" id="pretry">RESTART CHECKPOINT</button>
  <button class="btn small" id="pquit">QUIT TO TITLE</button>
  <details name="pgrp" id="popt"><summary>Options</summary>
    <label for="psens">Camera sensitivity</label>
    <input type="range" id="psens" min="0.25" max="2" step="0.05">
    <button class="btn small" id="pblood" style="margin-top:12px"></button>
    <button class="btn small" id="pgfx" style="margin:10px 0 14px"></button>
    <p class="note" id="pgfxn" style="margin-top:-6px"></p>
  </details>
  <details name="pgrp" id="pchapg"><summary>Chapters</summary><div class="chaps" id="pchap"></div></details>
  <details name="pgrp"><summary>Controls</summary><dl id="phelp"></dl></details>
  <details name="pgrp" id="ptrial"><summary>Trials</summary>
    <p class="note">Things being tried out. They may look unfinished.</p>
    <button class="btn small" id="pmodel"></button>
  </details>
</div>
<div id="gpu"><h2></h2><p></p><button class="btn" onclick="location.reload()">RELOAD</button></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
