<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Unsung</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*{touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:#070913;color:#efe6d2;font-family:"Cormorant Garamond",Georgia,serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#bars{position:absolute;left:16px;top:14px;width:min(44vw,260px)}
.bar{height:8px;background:rgba(8,8,14,.6);border:1px solid rgba(239,230,210,.5);margin-bottom:5px;position:relative;border-radius:1px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;transition:transform .12s linear}
.bar.hp i{background:#c8322f}.bar.tired{animation:tired .5s}@keyframes tired{0%,60%{border-color:#ff5040;box-shadow:0 0 8px #ff5040}}.bar.st{height:5px;width:80%}.bar.st i{background:#d9b24a}
#obj{position:absolute;left:16px;top:50px;max-width:min(92vw,520px);white-space:nowrap;font-size:16px;letter-spacing:.04em;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .4s}
#obj::before{content:"";display:inline-block;width:7px;height:7px;background:#d9b24a;transform:rotate(45deg);margin:0 9px 2px 2px}
#hold{position:absolute;left:16px;top:80px;width:min(44vw,220px);display:none}
#hold .bar{height:5px}#hold .bar i{background:#8fd0c0}
#tgt{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:min(52vw,340px);text-align:center;opacity:0;transition:opacity .2s}
#tgt span{font-size:13px;letter-spacing:.24em;text-shadow:0 1px 3px #000}
#tgt .bar{margin-top:4px;height:6px}#tgt .bar i{background:#e8dcc0}
#tgt.boss{top:auto;bottom:74px;width:min(80vw,560px)}#tgt.boss .bar i{background:#a66cf0}#tgt.boss span{font-size:16px}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:clamp(24px,6vw,46px);font-weight:700;letter-spacing:.28em;text-indent:.28em;opacity:0;transition:opacity .6s;text-shadow:0 2px 8px #000}
#banner.long{font-size:clamp(17px,4vw,26px);font-weight:500;font-style:italic;letter-spacing:.08em;text-indent:0;top:30%}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;max-width:min(92vw,620px);text-align:center;font-size:16px;line-height:1.35;
  padding:7px 16px;background:rgba(8,8,14,.55);border-radius:2px;opacity:0;transition:opacity .3s}
#hint b{color:#e9c15a;font-weight:700}
#obj{transform-origin:left center}
#obj.new{animation:objin 2.2s ease-out}#obj.new::before{animation:objmark 2.2s ease-out}
@keyframes objin{0%{transform:translateX(-12px) scale(1.16);color:#ffe7a0;text-shadow:0 0 16px #e9c15a,0 1px 3px #000}12%,55%{transform:scale(1.16);color:#ffe7a0;text-shadow:0 0 16px #e9c15a,0 1px 3px #000}}
@keyframes objmark{0%,55%{box-shadow:0 0 10px 3px #e9c15a;background:#ffe7a0}}
#hint.new{animation:hintin 2.4s ease-out}
@keyframes hintin{0%{transform:translateX(-50%) translateY(12px) scale(1.18);background:rgba(8,8,14,.9);box-shadow:0 0 0 1px #e9c15a,0 0 26px rgba(233,193,90,.85)}14%,55%{transform:translateX(-50%) scale(1.18);background:rgba(8,8,14,.9);box-shadow:0 0 0 1px #e9c15a,0 0 26px rgba(233,193,90,.85)}100%{box-shadow:0 0 0 1px rgba(233,193,90,0),0 0 26px rgba(233,193,90,0)}}
#thought{position:absolute;left:50%;transform:translateX(-50%);top:20%;width:max-content;max-width:min(84vw,440px);text-align:center;font-size:19px;font-style:italic;line-height:1.3;color:#f4eee0;
  padding:13px 28px 15px;background:rgba(26,29,42,.72);border:1px solid rgba(226,230,240,.38);border-radius:999px/60px;box-shadow:0 0 22px 7px rgba(200,208,226,.16),inset 0 0 18px rgba(200,208,226,.12);opacity:0;transition:opacity .9s}
#thought::before,#thought::after{content:"";position:absolute;left:50%;border-radius:50%;background:rgba(26,29,42,.72);border:1px solid rgba(226,230,240,.38);box-shadow:0 0 10px 2px rgba(200,208,226,.14)}
#thought::before{width:14px;height:14px;margin-left:-16px;bottom:-21px}#thought::after{width:8px;height:8px;margin-left:-3px;bottom:-34px}
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;width:min(94vw,640px);padding:14px 20px 18px;background:rgba(8,8,14,.82);
  border-top:1px solid rgba(217,178,74,.7);display:none}
#dlg .who{font-size:13px;letter-spacing:.26em;color:#e9c15a;margin-bottom:5px;text-transform:uppercase}
#dlg .txt{font-size:20px;line-height:1.3;min-height:2.6em}
#dlg .more{position:absolute;right:14px;bottom:6px;font-size:12px;letter-spacing:.14em;opacity:.65;animation:pulse 1.4s ease-in-out infinite}
#dlg{cursor:pointer;pointer-events:auto}
#fade{position:fixed;inset:0;background:#05060c;opacity:1;pointer-events:none;transition:opacity 1s}
#chron{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;background:#05060c;cursor:pointer}
#chron .page{width:min(100%,560px);transition:opacity 1s}
#chron.out .page{opacity:0}
#chron h2{font-size:13px;letter-spacing:.3em;font-weight:500;color:#e9c15a;padding-bottom:12px;margin-bottom:22px;text-transform:uppercase;border-bottom:1px solid rgba(217,178,74,.35);opacity:0;transition:opacity 1.1s}
#chron.on h2{opacity:1}
#chron p{font-size:clamp(17px,4.4vw,22px);line-height:1.45;margin-bottom:16px;opacity:0;transition:opacity 1.1s}
#chron p.on{opacity:1}
#chron p em{display:block;text-align:center;margin-bottom:6px}
#chron .tap{margin-top:10px;font-size:12px;letter-spacing:.3em;opacity:0;text-align:center}
#chron .tap.on{opacity:.55;animation:tapin 1s ease-out .9s both,pulse 1.6s ease-in-out 1.9s infinite}@keyframes tapin{from{opacity:0}}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch button{position:absolute;pointer-events:auto;border-radius:50%;border:1.5px solid rgba(239,230,210,.65);background:rgba(8,8,14,.4);
  color:#efe6d2;font:700 12px "Cormorant Garamond",Georgia,serif;letter-spacing:.1em;touch-action:none}
#touch button.on{background:rgba(217,178,74,.55)}
#bL{right:18px;bottom:64px;width:82px;height:82px;font-size:14px}
#bH{right:112px;bottom:30px;width:62px;height:62px}
#bD{right:116px;bottom:106px;width:62px;height:62px}
#bB{right:42px;bottom:160px;width:66px;height:66px}
#bK{right:18px;bottom:242px;width:50px;height:50px;font-size:10px}
#stick,#knob{position:absolute;border-radius:50%;display:none;pointer-events:none}
#stick{width:110px;height:110px;margin:-55px 0 0 -55px;border:1.5px solid rgba(239,230,210,.45);background:rgba(8,8,14,.25)}
#knob{width:46px;height:46px;margin:-23px 0 0 -23px;background:rgba(239,230,210,.55)}
#title,#pause{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at center,rgba(7,9,19,.55),rgba(7,9,19,.95))}
#pause{display:none;background:rgba(5,6,12,.94);overflow-y:auto}
#pause h2{font-size:15px;letter-spacing:.4em;text-indent:.4em;font-weight:500;color:#e9c15a;margin-bottom:22px}
.btn{font:700 17px "Cormorant Garamond",Georgia,serif;letter-spacing:.3em;text-indent:.3em;color:#efe6d2;background:rgba(8,8,14,.5);border:1.5px solid rgba(217,178,74,.75);
  padding:12px 0;width:min(70vw,240px);margin:6px 0;cursor:pointer;border-radius:2px}
.btn:hover,.btn:focus-visible{background:rgba(217,178,74,.25);outline:none}
.btn.main{font-size:22px;padding:14px 0;margin-top:30px}
#tcont+.sub+.btn{margin-top:22px}
.btn.small{font-size:13px;padding:9px 0}
#pause label{display:block;margin:18px 0 6px;font-size:14px;letter-spacing:.14em}
#pause input[type=range]{width:min(70vw,240px);accent-color:#d9b24a}
#title details{margin-top:18px;font-size:14px;letter-spacing:.1em}
#title summary{cursor:pointer;opacity:.75;list-style:none}#title summary::-webkit-details-marker{display:none}
#pause dl{margin-top:20px;display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:14px;text-align:left}
#pause dt{color:#e9c15a;text-align:right}
#bP{top:12px;right:12px;width:40px;height:40px;font-size:15px;letter-spacing:0}
#title h1{font-size:clamp(38px,11vw,84px);letter-spacing:.2em;text-indent:.2em;font-weight:700}
#title p.sub{letter-spacing:.3em;font-size:13px;margin-top:8px;opacity:.75;font-style:italic}
#title dl{margin-top:12px;display:grid;grid-template-columns:auto auto;gap:5px 16px;font-size:15px;text-align:left}
#title dt{color:#e9c15a;text-align:right}#title dd{opacity:.9}

@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){#dlg .more,#chron .tap,#obj.new,#hint.new{animation:none}}
@media (max-width:600px){#bars{width:40vw}#tgt{left:auto;right:62px;transform:none;width:36vw}#tgt.boss{left:50%;right:auto;transform:translateX(-50%);bottom:auto;top:132px;width:80vw}}
@media (pointer:coarse){#hint{bottom:auto;top:108px}#tgt.boss~#hint{top:176px}#dlg{bottom:auto;top:96px}#thought{top:min(196px,34%);font-size:17px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="visibility:hidden">
  <div id="bars"><div class="bar hp"><i id="hp"></i></div><div class="bar st"><i id="st"></i></div></div>
  <div id="obj"></div>
  <div id="hold"><div class="bar"><i id="holdp"></i></div></div>
  <div id="tgt"><span id="tname"></span><div class="bar"><i id="thp"></i></div></div>
  <div id="banner"></div>
  <div id="hint"></div>
  <div id="thought"></div>
  <div id="dlg"><div class="who" id="dwho"></div><div class="txt" id="dtxt"></div><div class="more" id="dmore"></div></div>
</div>
<div id="touch">
  <div id="stick"></div><div id="knob"></div>
  <button id="bL" data-a="l">STRIKE</button>
  <button id="bH" data-a="h">HEAVY</button>
  <button id="bD" data-a="d">DODGE</button>
  <button id="bB" data-a="b">GUARD</button>
  <button id="bK" data-a="k">LOCK</button>
  <button id="bP" data-a="p" aria-label="Pause">II</button>
</div>
<div id="fade"></div>
<div id="chron"><div class="page"><h2 id="chead"></h2><div id="clines"></div><div class="tap" id="ctap"></div></div></div>
<div id="title">
  <h1>THE UNSUNG</h1>
  <button class="btn main" id="tcont" style="display:none"></button>
  <p class="sub" id="tcwhere"></p>
  <button class="btn main" id="tplay">PLAY</button>
  <details><summary>Controls</summary><dl id="thelp"></dl></details>
</div>
<div id="pause">
  <h2>PAUSED</h2>
  <button class="btn" id="presume">RESUME</button>
  <button class="btn small" id="pretry">RESTART CHECKPOINT</button>
  <button class="btn small" id="pquit">QUIT TO TITLE</button>
  <label for="psens">Camera sensitivity</label>
  <input type="range" id="psens" min="0.25" max="2" step="0.05">
  <button class="btn small" id="pblood" style="margin-top:16px"></button>
  <dl id="phelp"></dl>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
